<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>MochiMUD</title>
    
    <link rel="stylesheet" href="MochiMud.css"/>
</head>

<body>
    <header>
        <div class="container">
            <div id="header-content">
                <h1>MochiMUD</h1>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="output"></div>

            <form id="formInput">
                <div id="input">
                    <input type="text" id="textInput" name="textInput" />
                </div>
            </form>
        </div>
    </main>

    <script src="/lib/signalr/dist/browser/signalr.js"></script>
    <script src="/MochiMudClient.js"></script>
    <script>
        const view = {
            output: document.getElementById('output'),
            formInput: document.getElementById('formInput'),
            textInput: document.getElementById('textInput')
        };

        const mochiMudClient = new MochiMudClient(view);
        mochiMudClient.start();
    </script>
</body>
</html>
